[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unimem"
dynamic = ["version"]
description = "A local-first, lazy, cross-client memory layer for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Yabuku-xD" }]
keywords = ["memory", "mcp", "agents", "claude-code", "codex", "cursor", "sqlite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = []

[project.optional-dependencies]
semantic = ["fastembed>=0.7.5,<1"]
benchmark = ["duckdb>=1.5,<2", "ijson>=3.4,<4"]
enrich = ["mlx-lm>=0.32,<1; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.urls]
Homepage = "https://github.com/Yabuku-xD/unimem"
Repository = "https://github.com/Yabuku-xD/unimem"
Issues = "https://github.com/Yabuku-xD/unimem/issues"
Changelog = "https://github.com/Yabuku-xD/unimem/blob/main/CHANGELOG.md"

[project.scripts]
unimem = "unimem.cli:main"

[tool.setuptools.dynamic]
version = { attr = "unimem.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Correctness and import hygiene; formatting is not enforced.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
# Benchmark helpers time lambdas that run immediately inside the loop.
per-file-ignores = { "benchmarks/*" = ["B023"], "tests/*" = ["B023"] }
