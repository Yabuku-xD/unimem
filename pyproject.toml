[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unimem"
version = "0.1.0"
description = "A local-first, lazy, cross-client memory layer for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "unimem contributors" }]
dependencies = []

[project.optional-dependencies]
semantic = ["fastembed>=0.7.5,<1"]
benchmark = ["duckdb>=1.5,<2", "ijson>=3.4,<4"]
enrich = ["mlx-lm>=0.32,<1; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
unimem = "unimem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
